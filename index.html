<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="stylesheet" href="style.css">
  
  <title>Product preview card component</title>

</head>
<body>
  <main>
    <div class="container">
      <img class="phone" src="images/image-product-mobile.jpg" alt="">
      <img class="desktop" src="images/image-product-desktop.jpg" alt="">
      <div class="container_text">
         <div class="perf">P e r f u m e</div>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="descr">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        <div class="price">
          <div class="now">$149.99</div>
          <div class="past"><s>$169.99</s></div>
        </div>
        <button>
          <img src="images/icon-cart.svg" alt="">
          <p>Add to Cart</p>
        </button>
      </div>
    </div>
    
  </main>
  
  <footer class="attribution">
    <div class="foot">
      Coded by <a href="https://github.com/KirilldevX">KirillDevX</a>.
    </div>
  </footer>
</body>
</html>
